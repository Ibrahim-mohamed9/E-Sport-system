<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | ZU E-Sports</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar">
    <a href="../index.html" class="nav-logo">⚡ ZU<span>ESPORTS</span></a>
    <ul class="nav-links" id="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="tournaments.html">Tournaments</a></li>
        <li><a href="teams.html">Teams</a></li>
        <li><a href="leaderboard.html" class="active">Leaderboard</a></li>
        <li><a href="help.html">Help</a></li>
    </ul>
    <div class="nav-actions" id="nav-actions"></div>
    <button class="menu-toggle" id="menu-toggle">☰</button>
</nav>

<div class="page-wrapper">
    <div class="container section">
        <div style="text-align:center;margin-bottom:3rem">
            <div style="font-family:var(--font-display);font-size:0.9rem;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:0.5rem">Season Rankings</div>
            <h1 style="font-size:2.5rem">🏆 Leaderboard</h1>
            <p style="color:var(--text-muted);margin-top:0.5rem">Top teams ranked by tournament performance</p>
        </div>

        <!-- TOP 3 PODIUM -->
        <div id="podium" style="display:flex;justify-content:center;align-items:flex-end;gap:1rem;margin-bottom:3rem;flex-wrap:wrap"></div>

        <!-- FULL TABLE -->
        <div class="card">
            <div class="card-header">
                <h3>Full Rankings</h3>
                <select id="game-filter" class="form-control" style="width:160px;padding:6px 12px" onchange="filterLeaderboard()">
                    <option value="">All Games</option>
                    <option value="Valorant">Valorant</option>
                    <option value="CS2">CS2</option>
                    <option value="League of Legends">League of Legends</option>
                    <option value="FIFA">FIFA</option>
                </select>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:60px">Rank</th>
                            <th>Team</th>
                            <th>Game</th>
                            <th>Captain</th>
                            <th>Members</th>
                            <th>Wins</th>
                            <th>Losses</th>
                            <th>Win Rate</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="8"><div class="loading"><div class="spinner"></div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="footer-title">⚡ ZU ESPORTS</div>
    <p>Faculty of Computers & Informatics — Zagazig University</p>
</footer>

<script src="../js/app.js"></script>
<script>
let allTeams = [];

async function loadLeaderboard() {
    const res = await GET('/leaderboard');
    if (res && res.ok) {
        allTeams = res.data;
        renderPodium(allTeams.slice(0, 3));
        renderTable(allTeams);
    }
}

function filterLeaderboard() {
    const game = document.getElementById('game-filter').value;
    const filtered = game ? allTeams.filter(t => t.game === game) : allTeams;
    renderTable(filtered);
}

function renderPodium(top3) {
    const podium = document.getElementById('podium');
    if (top3.length === 0) { podium.innerHTML = ''; return; }

    // Order: 2nd, 1st, 3rd
    const order = [top3[1], top3[0], top3[2]].filter(Boolean);
    const heights = [top3[1] ? '140px' : '0', '180px', top3[2] ? '110px' : '0'];
    const ranks = [2, 1, 3];
    const medals = ['🥈', '🥇', '🥉'];
    const colors = ['#94a3b8', '#fbbf24', '#cd7f32'];

    podium.innerHTML = order.map((t, i) => {
        const h = heights[i];
        return `
            <div style="text-align:center;cursor:pointer" onclick="window.location.href='/pages/team-detail.html?id=${t.id}'">
                <div style="font-size:2rem;margin-bottom:0.5rem">${medals[i]}</div>
                <div class="avatar" style="width:56px;height:56px;font-size:1rem;margin:0 auto 0.5rem;border:2px solid ${colors[i]}">${(t.tag||t.name.substring(0,2)).toUpperCase()}</div>
                <div style="font-weight:700;font-size:0.95rem;max-width:120px">${t.name}</div>
                <div style="color:var(--text-muted);font-size:0.8rem">${t.game}</div>
                <div style="background:${colors[i]};color:#0a0e1a;font-family:var(--font-display);font-weight:900;padding:0.5rem 1.5rem;border-radius:8px 8px 0 0;margin-top:0.75rem;height:${h};display:flex;align-items:flex-start;justify-content:center;padding-top:0.75rem;font-size:0.9rem">
                    #${ranks[i]}
                </div>
            </div>
        `;
    }).join('');
}

function renderTable(teams) {
    const tbody = document.getElementById('leaderboard-body');
    if (teams.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state" style="padding:2rem">No teams found</div></td></tr>';
        return;
    }

    tbody.innerHTML = teams.map((t, i) => {
        const winRate = t.win_rate || 0;
        const rankStyle = i === 0 ? 'color:#fbbf24' : i === 1 ? 'color:#94a3b8' : i === 2 ? 'color:#cd7f32' : 'color:var(--text-muted)';
        const bar = `<div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;background:var(--border);border-radius:100px;height:6px;overflow:hidden">
                <div style="width:${winRate}%;height:100%;background:${winRate>60?'var(--accent-green)':winRate>40?'var(--accent)':'var(--accent-red)'};border-radius:100px"></div>
            </div>
            <span style="font-size:0.8rem;color:var(--accent);font-family:var(--font-display);font-weight:700;min-width:36px">${winRate}%</span>
        </div>`;

        return `
            <tr style="cursor:pointer" onclick="window.location.href='/pages/team-detail.html?id=${t.id}'">
                <td><span class="rank-number" style="${rankStyle}">#${i + 1}</span></td>
                <td>
                    <div style="display:flex;align-items:center;gap:10px">
                        <div class="avatar" style="width:36px;height:36px;font-size:0.7rem">${(t.tag||t.name.substring(0,2)).toUpperCase()}</div>
                        <div>
                            <div style="font-weight:700;color:var(--text-primary)">${t.name}</div>
                            <div style="font-size:0.75rem;color:var(--text-muted)">[${t.tag||'—'}]</div>
                        </div>
                    </div>
                </td>
                <td>${t.game}</td>
                <td style="color:var(--text-secondary)">${t.captain_name}</td>
                <td style="color:var(--text-muted)">${t.member_count}</td>
                <td style="color:var(--accent-green);font-weight:700;font-family:var(--font-display)">${t.wins}</td>
                <td style="color:var(--accent-red);font-family:var(--font-display)">${t.losses}</td>
                <td style="min-width:140px">${bar}</td>
            </tr>
        `;
    }).join('');
}

document.addEventListener('DOMContentLoaded', loadLeaderboard);
</script>
</body>
</html>
