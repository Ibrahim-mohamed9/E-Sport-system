<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ZU E-Sports</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 1rem 2rem;
            background: radial-gradient(ellipse at top, rgba(0,212,255,0.05) 0%, var(--bg-dark) 60%);
        }
        .auth-box {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
        }
        .auth-logo {
            text-align: center;
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="../index.html" class="nav-logo">⚡ ZU<span>ESPORTS</span></a>
    <div class="nav-actions" id="nav-actions"></div>
</nav>

<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-logo">⚡ ZU ESPORTS</div>
        <p class="auth-subtitle">Sign in to your account</p>

        <div id="alert-box"></div>

        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="your@student.edu" autocomplete="email">
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">
            🎮 Sign In
        </button>

        <p style="text-align:center;margin-top:1.5rem;color:var(--text-muted);font-size:0.9rem">
            No account? <a href="register.html" style="color:var(--accent)">Create one free</a>
        </p>
    </div>
</div>

<script src="../js/app.js"></script>
<script>
// Redirect if already logged in
if (isLoggedIn()) window.location.href = '/pages/dashboard.html';

async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const alertBox = document.getElementById('alert-box');

    alertBox.innerHTML = '';

    if (!email || !password) {
        alertBox.innerHTML = '<div class="alert alert-error">Please fill in all fields.</div>';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const res = await POST('/auth/login', { email, password });

    btn.disabled = false;
    btn.textContent = '🎮 Sign In';

    if (res && res.ok) {
        setToken(res.data.token);
        setUser(res.data.user);
        showToast('Welcome back, ' + res.data.user.username + '!', 'success');
        setTimeout(() => {
            if (res.data.user.role === 'admin') {
                window.location.href = '/pages/admin.html';
            } else {
                window.location.href = '/pages/dashboard.html';
            }
        }, 800);
    } else {
        alertBox.innerHTML = `<div class="alert alert-error">${res?.data?.error || 'Login failed.'}</div>`;
    }
}

// Allow pressing Enter to login
document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
