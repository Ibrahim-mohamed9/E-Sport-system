<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ZU E-Sports</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 1rem 2rem;
            background: radial-gradient(ellipse at top, rgba(124,58,237,0.05) 0%, var(--bg-dark) 60%);
        }
        .auth-box {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="../index.html" class="nav-logo">⚡ ZU<span>ESPORTS</span></a>
    <div class="nav-actions" id="nav-actions"></div>
</nav>

<div class="auth-wrapper">
    <div class="auth-box">
        <div style="text-align:center;margin-bottom:2rem">
            <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:900;color:var(--accent)">⚡ ZU ESPORTS</div>
            <p style="color:var(--text-muted);font-size:0.9rem;margin-top:0.5rem">Create your player account</p>
        </div>

        <div id="alert-box"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group">
                <label class="form-label">Username *</label>
                <input type="text" id="username" class="form-control" placeholder="CoolPlayer99">
            </div>
            <div class="form-group">
                <label class="form-label">Gaming ID</label>
                <input type="text" id="gaming_id" class="form-control" placeholder="In-game name">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="your@student.edu">
        </div>
        <div class="form-group">
            <label class="form-label">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
            <label class="form-label">Confirm Password *</label>
            <input type="password" id="confirm" class="form-control" placeholder="Repeat password">
        </div>

        <button class="btn btn-primary btn-full" id="reg-btn" onclick="doRegister()">
            🚀 Create Account
        </button>

        <p style="text-align:center;margin-top:1.5rem;color:var(--text-muted);font-size:0.9rem">
            Already have an account? <a href="login.html" style="color:var(--accent)">Sign in</a>
        </p>
    </div>
</div>

<script src="../js/app.js"></script>
<script>
if (isLoggedIn()) window.location.href = 'dashboard.html';

async function doRegister() {
    const username = document.getElementById('username').value.trim();
    const gaming_id = document.getElementById('gaming_id').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const alertBox = document.getElementById('alert-box');
    const btn = document.getElementById('reg-btn');

    alertBox.innerHTML = '';

    if (!username || !email || !password) {
        alertBox.innerHTML = '<div class="alert alert-error">Please fill in all required fields.</div>';
        return;
    }

    if (password !== confirm) {
        alertBox.innerHTML = '<div class="alert alert-error">Passwords do not match.</div>';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    const res = await POST('/auth/register', { username, email, password, gaming_id });

    btn.disabled = false;
    btn.textContent = '🚀 Create Account';

    if (res && res.ok) {
        alertBox.innerHTML = '<div class="alert alert-success">Account created! Redirecting to login...</div>';
        setTimeout(() => window.location.href = '/pages/login.html', 1500);
    } else {
        alertBox.innerHTML = `<div class="alert alert-error">${res?.data?.error || 'Registration failed.'}</div>`;
    }
}
</script>
</body>
</html>
